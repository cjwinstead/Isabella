---
module: led_controller_with_multiple_programs
inputs: |
  input [15:0] data_in,
outputs: |
  output reg [15:0] led
initial: |
  led = data_in;
rst: |
  led <= data_in;
hex_prefix: 8
commands:
- name: LED_CLEAR
  databytes: 0
  verilog: led <= 0;
- name: LED_SET_LOW_BYTE
  databytes: 1
  verilog: led[7:0] <= data;
- name: LED_SET_HIGH_BYTE
  databytes: 1
  verilog: led[15:8] <= data;
- name: LED_OR_LOW_BYTE
  databytes: 1
  verilog: led[7:0] <= led[7:0] | data;
- name: LED_OR_HIGH_BYTE
  databytes: 1
  verilog: led[15:8] <= led[15:8]|data;
- name: LED_NAND_LOW_BYTE
  databytes: 1
  verilog: led[7:0] <= led[7:0]&data;
- name: LED_NAND_HIGH_BYTE
  databytes: 1
  verilog: led[15:8] <= led[15:8]&data;
- name: LED_FLOOD
  databytes: 0
  verilog: led <= 16'hffff;
- name: LED_RIGHT_SHIFT
  databytes: 0
  verilog: led <= {led[0],led[15:1]};
- name: LED_LEFT_SHIFT
  databytes: 0
  verilog: led <= {led[14:0],led[15]};
- name: LED_SET
  databytes: 0
  verilog: led <= data_in;
- name: LED_NOT
  databytes: 0
  verilog: led <= ~led;
- name: LED_SET_B
  databytes: 0
  verilog: led[7:0] <= _B;
- name: LED_LOAD_B
  databytes: 0
  verilog: _B  <= data_in[7:0];
program: |
  # FIRST PROGRAM at iaddr 'd0 ----------------- "scan"
  0:	LED_SET_LOW_BYTE  # set 0-7
  1:	01		  # one light on
  2:	LED_SET_HIGH_BYTE # set 8-16
  3:	00		  # no lights on
  4:	LED_LEFT_SHIFT	  # rotate light
  5:	SLEEP_MS 	  # pause
  6:	20     		  # 20ms
  7: 	JUMP   		  # loop back
  8:	04      	  # to left shift cmd
  # SECOND PROGRAM at iaddr 'd9 ----------------- "flood"
  9:    LED_FLOOD         # 
  10:    NULL_CMD         # 
  # THIRD PROGRAM at iaddr 'd10 ------------------"set"
  11:    LED_SET          # 
  12:    NULL_CMD         # 
  # FOURTH PROGRAM at iaddr 'd13 ---------------- "invert"
  13:    LED_NOT          # 
  14:    NULL_CMD         # 
  # FIFTH PROGRAM at iaddr 'd15 ----------------- "twinkle"
